<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>NoteHEI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      max-width: 800px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      text-align: center;
    }

    main p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #475569;
      margin: 0;
    }
  </style>
</head>
<body>
<div th:replace="~{layout/fragments :: header(title='NoteHEI — Gestion de scolarité')}"></div>
<div th:replace="~{layout/fragments :: nav}"></div>

<main>
  <p sec:authorize="hasRole('STUDENT')">Bienvenue. Utilisez le menu pour consulter vos notes et relevés.</p>
  <p sec:authorize="hasRole('TEACHER')">Bienvenue. Utilisez le menu pour saisir des notes et suivre les notes manquantes.</p>
  <p sec:authorize="hasRole('ADMIN')">Bienvenue. Utilisez le menu pour gérer la structure académique.</p>
</main>

<div th:replace="~{layout/fragments :: footer}"></div>
</body>
</html>
