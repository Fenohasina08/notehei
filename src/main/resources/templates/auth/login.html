<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion — NoteHEI</title>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgb(0 0 0 / 0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      margin: 0 0 0.5rem;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .login-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(79 70 229 / 0.1);
    }

    .error-message {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: var(--radius);
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      font-size: 0.9rem;
    }

    .logout-message {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: var(--radius);
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      font-size: 0.9rem;
    }

    .login-button {
      width: 100%;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-button:hover {
      background: var(--primary-hover);
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .register-link {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .register-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <div class="login-header">
      <h1>NoteHEI</h1>
      <p>Gestion de scolarité</p>
    </div>

    <div
            th:if="${errorMessage}"
            class="error-message"
            th:text="${errorMessage}">
      Email ou mot de passe incorrect.
    </div>

    <div
            th:if="${logoutMessage}"
            class="logout-message"
            th:text="${logoutMessage}">
      Vous avez été déconnecté.
    </div>

    <form method="post" action="/login">

      <div class="form-group">
        <label for="email">Adresse email</label>

        <input
                type="email"
                id="email"
                name="email"
                placeholder="votre@email.com"
                autocomplete="email"
                required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required>
      </div>

      <button
              type="submit"
              class="login-button">
        Se connecter
      </button>

    </form>

    <div class="register-link">
      Vous n'avez pas encore de compte ?
      <a th:href="@{/register}">Créer un compte</a>
    </div>

  </div>

</div>

</body>
</html>
