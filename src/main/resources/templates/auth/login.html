<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sign in — NoteHEI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #4f46e5;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-weight: 500;
      font-size: 0.875rem;
      color: #64748b;
    }
    input {
      padding: 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    button[type="submit"] {
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    button[type="submit"]:hover {
      background-color: #4338ca;
    }
    .divider {
      margin: 1.5rem 0;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      position: relative;
    }
    .divider span {
      background: #ffffff;
      padding: 0 0.75rem;
      color: #94a3b8;
      font-size: 0.85rem;
      position: relative;
      top: -0.75rem;
    }
    .btn-register {
      display: block;
      text-align: center;
      background-color: #f1f5f9;
      color: #334155;
      text-decoration: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    .btn-register:hover {
      background-color: #e2e8f0;
    }
    .error { color: #dc2626; font-size: 0.875rem; text-align: center; margin-bottom: 1rem; }
    .info { color: #2563eb; font-size: 0.875rem; text-align: center; margin-bottom: 1rem; }
  </style>
</head>
<body>

<main class="login-card">
  <h1>NoteHEI</h1>

  <p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>
  <p th:if="${logoutMessage}" th:text="${logoutMessage}" class="info"></p>

  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus placeholder="your.email@hei.school" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" />
    </div>

    <button type="submit">Sign in</button>
  </form>

  <div class="divider">
    <span>or</span>
  </div>

  <a th:href="@{/register}" class="btn-register">Create an account</a>
</main>

</body>
</html>
