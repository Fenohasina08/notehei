<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Account created — NoteHEI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .success-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      color: #4f46e5;
      font-size: 1.4rem;
      margin-top: 0;
    }
    .matricule {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 1rem;
      margin: 1.25rem 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1e293b;
    }
    p.hint {
      color: #64748b;
      font-size: 0.9rem;
    }
    a.btn-login {
      display: inline-block;
      margin-top: 1rem;
      background-color: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
    }
    a.btn-login:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
<main class="success-card">
  <h1>Account created</h1>
  <p class="hint">Your <span th:text="${successRole}">Student</span> account has been created. Your matricule is:</p>
  <div class="matricule" th:text="${successMatricule}">STD24001</div>
  <p class="hint">Keep it safe — you may need it for support requests.</p>
  <a th:href="@{/login}" class="btn-login">Go to Sign in</a>
</main>
</body>
</html>
