<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <style th:fragment="global-style">
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--primary);
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 2rem;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 0;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
    }

    h2, h3 {
      margin-top: 0;
      color: var(--text-main);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: fit-content;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      font-weight: 600;
      color: var(--text-muted);
      background-color: #f1f5f9;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .user-info {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-login,
    .btn-register,
    .btn-logout {
      display: inline-block;
      text-decoration: none;
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-login {
      background-color: var(--primary);
      color: white;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .btn-register {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-register:hover {
      background-color: #e2e8f0;
    }

    .btn-logout {
      margin-left: 0.75rem;
      color: #dc2626;
    }

    .btn-logout:hover {
      color: #b91c1c;
    }

    .error {
      color: #dc2626;
      font-size: 0.875rem;
    }

    .info {
      color: #2563eb;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<header th:fragment="header(title)">
  <h1 th:text="${title}">NoteHEI</h1>

  <div sec:authorize="isAuthenticated()">
    <span class="user-info">
      Connected as <strong sec:authentication="name">email</strong>
      (<span sec:authentication="authorities">role</span>)
    </span>
    <a th:href="@{/logout}" class="btn-logout">Sign out</a>
  </div>

  <div sec:authorize="!isAuthenticated()" class="auth-actions">
    <a th:href="@{/login}" class="btn-login">Login</a>
    <a th:href="@{/register}" class="btn-register">Create account</a>
  </div>
</header>

<nav th:fragment="nav">
  <ul>
    <li sec:authorize="hasRole('STUDENT')"><a th:href="@{/}">My Grades</a></li>
    <li sec:authorize="hasRole('STUDENT')"><a th:href="@{/screens/transcripts}">My Transcripts</a></li>
    <li sec:authorize="hasRole('TEACHER')"><a th:href="@{/screens/grades/dashboard}">Missing Grades</a></li>
    <li sec:authorize="hasRole('TEACHER')"><a th:href="@{/screens/grades}">Enter Grades</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/cohorts}">Cohorts</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/semesters}">Semesters</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/groups}">Groups</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/programs}">Programs</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/course-units}">Course Units</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/teaching-assignments}">Teaching Assignments</a></li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/screens/structure/organigramme}">Organigram</a></li>
  </ul>
</nav>

<footer th:fragment="footer">
  <p>&copy; NoteHEI — Academic Management</p>
</footer>

</body>
</html>
