<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

  <style th:fragment="global-style">

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 8px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--primary);
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 2rem;
      overflow-x: auto;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      white-space: nowrap;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
      overflow-x: auto;
    }

    section > h2:first-child {
      font-size: 1.15rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    h2,
    h3 {
      margin-top: 0;
      color: var(--text-main);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    select {
      background: #fff;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: fit-content;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th,
    td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      font-weight: 600;
      color: var(--text-muted);
      background-color: #f1f5f9;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .user-info {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-login,
    .btn-register,
    .btn-logout {
      display: inline-block;
      text-decoration: none;
      border-radius: var(--radius);
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-login {
      background-color: var(--primary);
      color: white;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .btn-register {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-register:hover {
      background-color: #e2e8f0;
    }

    .btn-logout {
      background: transparent;
      color: #dc2626;
      border: 1px solid #fecaca;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: #fef2f2;
      color: #b91c1c;
    }

    .user-badge {
      display: flex;
      align-items: center;
    }

    .user-text {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .user-name {
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .role-badge {
      background: #eef2ff;
      color: var(--primary);
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .error {
      color: #dc2626;
      font-size: 0.875rem;
    }

    .info {
      color: #2563eb;
      font-size: 0.875rem;
    }

    section > p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    section > p:only-child,
    table + p {
      text-align: center;
      padding: 1rem 0 0;
    }

    @media (max-width: 640px) {

      header,
      nav {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      header {
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
      }

      button {
        width: 100%;
      }

      .btn-logout {
        width: auto;
      }

      .user-text {
        flex-wrap: wrap;
      }
    }

  </style>
</head>

<body>

<header th:fragment="header(title)">

  <h1 th:text="${title}">
    NoteHEI
  </h1>

  <div sec:authorize="isAuthenticated()"
       class="auth-actions">

    <div class="user-badge">

      <span class="user-text">

        <span
                class="user-name"
                sec:authentication="name">
          email
        </span>

        <span
                class="role-badge"
                sec:authorize="hasRole('ADMIN')">
          Admin
        </span>

        <span
                class="role-badge"
                sec:authorize="hasRole('TEACHER')">
          Enseignant
        </span>

        <span
                class="role-badge"
                sec:authorize="hasRole('STUDENT')">
          Étudiant
        </span>

      </span>

    </div>

    <button
            type="button"
            class="btn-logout"
            onclick="logout()">
      Déconnexion
    </button>

  </div>

  <div sec:authorize="!isAuthenticated()"
       class="auth-actions">

    <a
            th:href="@{/login}"
            class="btn-login">
      Connexion
    </a>

    <a
            th:href="@{/register}"
            class="btn-register">
      Créer un compte
    </a>

  </div>

</header>

<nav th:fragment="nav">

  <ul>

    <li sec:authorize="hasRole('STUDENT')">
      <a th:href="@{/}">
        Mes notes
      </a>
    </li>

    <li sec:authorize="hasRole('STUDENT')">
      <a th:href="@{/screens/transcripts}">
        Mes relevés
      </a>
    </li>

    <li sec:authorize="hasRole('TEACHER')">
      <a th:href="@{/screens/grades/dashboard}">
        Notes manquantes
      </a>
    </li>

    <li sec:authorize="hasRole('TEACHER')">
      <a th:href="@{/screens/grades}">
        Saisir les notes
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/cohorts}">
        Promotions
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/semesters}">
        Semestres
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/groups}">
        Groupes
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/programs}">
        Parcours
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/course-units}">
        UE
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/teaching-assignments}">
        Affectations
      </a>
    </li>

    <li sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/screens/structure/organigramme}">
        Organigramme
      </a>
    </li>

  </ul>

</nav>

<footer th:fragment="footer">

  <p>
    &copy; NoteHEI — Academic Management
  </p>

</footer>

<script>
  async function logout() {

    try {

      await fetch("/auth/logout", {
        method: "POST",
        credentials: "same-origin"
      });

    } catch (error) {

      console.error(
              "Erreur lors de la déconnexion :",
              error
      );

    } finally {

      /*
       * Le cookie NOTEHEI_TOKEN est supprimé
       * par le backend.
       *
       * On retourne ensuite vers la page de connexion.
       */
      window.location.href = "/login";
    }
  }
</script>

</body>
</html>
